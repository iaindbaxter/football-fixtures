name: Update Blackburn Fixtures

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install requests

      - run: python scripts/update_blackburn.py

      - run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add blackburn.json
          git commit -m "Auto-update Blackburn fixtures" || echo "No changes"
          git push
