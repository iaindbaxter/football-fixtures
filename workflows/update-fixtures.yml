name: Update Liverpool Fixtures

on:
  schedule:
    - cron: "0 5 * * *"   # 06:00 UK time (BST = UTC+1)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install requests pytz

      - name: Fetch ESPN fixtures
        run: |
          python scripts/update_fixtures.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add liverpool.json
          git commit -m "Auto-update fixtures" || echo "No changes to commit"
          git push

